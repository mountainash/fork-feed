name: release

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set-up-docker-buildx
        uses: docker/setup-buildx-action@v3

      - name: login-to-ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract-metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-helm-chart:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: generate-token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: kontrolplane
          repositories: helm-charts

      - name: checkout-helm-charts
        uses: actions/checkout@v4
        with:
          repository: kontrolplane/helm-charts
          token: ${{ steps.app-token.outputs.token }}

      - name: bump-versions
        id: bump
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"

          # read current chart version and bump patch
          CURRENT=$(grep '^version:' charts/feed/Chart.yaml | awk '{print $2}')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEXT_PATCH=$((PATCH + 1))
          CHART_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"

          sed -i "s/^version:.*/version: ${CHART_VERSION}/" charts/feed/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${APP_VERSION}\"/" charts/feed/Chart.yaml

          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Updated appVersion to ${APP_VERSION}, chart version to ${CHART_VERSION}"
          cat charts/feed/Chart.yaml

      - name: create-pull-request
        run: |
          APP_VERSION="${{ steps.bump.outputs.app_version }}"
          CHART_VERSION="${{ steps.bump.outputs.chart_version }}"
          BRANCH="feed/v${APP_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add charts/feed/Chart.yaml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(feed): bump to app ${APP_VERSION}, chart ${CHART_VERSION}"
          git push origin "$BRANCH"

          gh pr create \
            --repo kontrolplane/helm-charts \
            --base main \
            --head "$BRANCH" \
            --title "feed: bump to v${APP_VERSION}" \
            --body "$(cat <<EOF
          Automated bump triggered by [kontrolplane/feed v${APP_VERSION}](https://github.com/kontrolplane/feed/releases/tag/v${APP_VERSION}).

          - **appVersion**: \`${APP_VERSION}\`
          - **chart version**: \`${CHART_VERSION}\`
          EOF
          )"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
