root = "."
tmp_dir = "tmp"

[build]
  cmd = "$HOME/go/bin/templ generate && go build -o ./tmp/main ./cmd/server"
  bin = "./tmp/main"
  delay = 500
  exclude_dir = ["tmp", "node_modules", ".git"]
  exclude_regex = ["_templ\\.go$"]
  include_ext = ["go", "templ", "css", "js"]
  include_dir = ["cmd", "internal", "templates", "static"]
  kill_delay = "1s"
  send_interrupt = true

[build.env]
  DEVELOPMENT_SEED = "true"
  DEVELOPMENT_DEBUG = "true"

[misc]
  clean_on_exit = true
